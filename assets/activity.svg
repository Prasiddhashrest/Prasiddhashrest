<svg
  xmlns="http://www.w3.org/2000/svg"
  width="820"
  height="210"
  viewBox="0 0 820 210"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Build Activity</title>
  <desc id="desc">
    A GitHub-style contribution grid with month and weekday labels.
  </desc>

  <defs>
    <style>
      .panel {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1;
      }

      .month,
      .day {
        fill: #8b949e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 11px;
      }

      .empty { fill: #21262d; }

      .g1 { fill: #9be9a8; }
      .g2 { fill: #40c463; }
      .g3 { fill: #30a14e; }
      .g4 { fill: #216e39; }
    </style>

    <rect id="cell" width="13" height="13" rx="3" ry="3" />

    <pattern
      id="gridPattern"
      x="0"
      y="0"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >
      <use href="#cell" x="0" y="0" class="empty" />
    </pattern>
  </defs>

  <!-- dark panel -->
  <rect x="12" y="12" width="796" height="186" rx="16" class="panel" />

  <!-- month labels -->
  <text x="92"  y="36" class="month">Jan</text>
  <text x="182" y="36" class="month">Feb</text>
  <text x="272" y="36" class="month">Mar</text>
  <text x="362" y="36" class="month">Apr</text>
  <text x="452" y="36" class="month">May</text>
  <text x="542" y="36" class="month">Jun</text>

  <!-- day labels -->
  <text x="28" y="69" class="day">Mon</text>
  <text x="28" y="105" class="day">Wed</text>
  <text x="28" y="141" class="day">Fri</text>

  <!-- full grid background -->
  <rect
    x="86"
    y="46"
    width="468"
    height="126"
    fill="url(#gridPattern)"
  />

  <!-- active contribution cells -->
  <g>
    <!-- row 1 -->
    <use href="#cell" x="104" y="46" class="g4"/>
    <use href="#cell" x="140" y="46" class="g2"/>
    <use href="#cell" x="194" y="46" class="g3"/>
    <use href="#cell" x="266" y="46" class="g2"/>
    <use href="#cell" x="320" y="46" class="g1"/>
    <use href="#cell" x="392" y="46" class="g3"/>
    <use href="#cell" x="464" y="46" class="g2"/>
    <use href="#cell" x="500" y="46" class="g4"/>

    <!-- row 2 -->
    <use href="#cell" x="86" y="64" class="g1"/>
    <use href="#cell" x="122" y="64" class="g2"/>
    <use href="#cell" x="176" y="64" class="g4"/>
    <use href="#cell" x="230" y="64" class="g2"/>
    <use href="#cell" x="302" y="64" class="g3"/>
    <use href="#cell" x="356" y="64" class="g1"/>
    <use href="#cell" x="428" y="64" class="g2"/>
    <use href="#cell" x="482" y="64" class="g4"/>

    <!-- row 3 -->
    <use href="#cell" x="104" y="82" class="g2"/>
    <use href="#cell" x="140" y="82" class="g1"/>
    <use href="#cell" x="194" y="82" class="g2"/>
    <use href="#cell" x="248" y="82" class="g4"/>
    <use href="#cell" x="302" y="82" class="g2"/>
    <use href="#cell" x="356" y="82" class="g3"/>
    <use href="#cell" x="392" y="82" class="g1"/>
    <use href="#cell" x="446" y="82" class="g2"/>
    <use href="#cell" x="500" y="82" class="g3"/>

    <!-- row 4 -->
    <use href="#cell" x="86" y="100" class="g4"/>
    <use href="#cell" x="140" y="100" class="g3"/>
    <use href="#cell" x="194" y="100" class="g1"/>
    <use href="#cell" x="248" y="100" class="g2"/>
    <use href="#cell" x="320" y="100" class="g4"/>
    <use href="#cell" x="374" y="100" class="g2"/>
    <use href="#cell" x="428" y="100" class="g1"/>
    <use href="#cell" x="482" y="100" class="g3"/>

    <!-- row 5 -->
    <use href="#cell" x="122" y="118" class="g2"/>
    <use href="#cell" x="176" y="118" class="g4"/>
    <use href="#cell" x="230" y="118" class="g2"/>
    <use href="#cell" x="266" y="118" class="g1"/>
    <use href="#cell" x="338" y="118" class="g3"/>
    <use href="#cell" x="392" y="118" class="g2"/>
    <use href="#cell" x="446" y="118" class="g1"/>
    <use href="#cell" x="518" y="118" class="g2"/>

    <!-- row 6 -->
    <use href="#cell" x="86" y="136" class="g1"/>
    <use href="#cell" x="158" y="136" class="g3"/>
    <use href="#cell" x="212" y="136" class="g2"/>
    <use href="#cell" x="284" y="136" class="g4"/>
    <use href="#cell" x="338" y="136" class="g1"/>
    <use href="#cell" x="410" y="136" class="g3"/>
    <use href="#cell" x="464" y="136" class="g2"/>
    <use href="#cell" x="518" y="136" class="g4"/>

    <!-- row 7 -->
    <use href="#cell" x="104" y="154" class="g4"/>
    <use href="#cell" x="140" y="154" class="g2"/>
    <use href="#cell" x="212" y="154" class="g1"/>
    <use href="#cell" x="248" y="154" class="g2"/>
    <use href="#cell" x="320" y="154" class="g4"/>
    <use href="#cell" x="374" y="154" class="g2"/>
    <use href="#cell" x="446" y="154" class="g3"/>
    <use href="#cell" x="500" y="154" class="g1"/>
  </g>
</svg>
