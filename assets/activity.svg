<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="270"
  viewBox="0 0 900 270"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Build Activity</title>
  <desc id="desc">
    A GitHub-style dark contribution grid with light green activity cells
    and a looping Pac-Man animation following the contribution path.
  </desc>

  <defs>
    <style>
      .panel {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1;
      }

      .month,
      .day,
      .subtext,
      .smalltext {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
      }

      .title {
        fill: #f0f6fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
      }

      .subtext {
        fill: #c9d1d9;
        font-size: 13px;
      }

      .month,
      .day,
      .smalltext {
        fill: #8b949e;
        font-size: 11px;
      }

      .empty {
        fill: #21262d;
      }

      .g1 { fill: #9be9a8; }
      .g2 { fill: #40c463; }
      .g3 { fill: #30a14e; }
      .g4 { fill: #216e39; }

      .pac-body {
        fill: #f2cc60;
      }

      .pac-eye {
        fill: #0d1117;
      }

      .pellet {
        fill: #f2cc60;
        opacity: 0.95;
      }
    </style>

    <rect id="cell" width="13" height="13" rx="3" ry="3" />

    <pattern
      id="gridPattern"
      x="0"
      y="0"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >
      <use href="#cell" x="0" y="0" class="empty" />
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect x="12" y="12" width="876" height="246" rx="18" class="panel" />

  <!-- Header -->
  <text x="34" y="42" class="title">Build Activity</text>
  <text x="34" y="63" class="subtext">
    projects · experiments · continuous learning
  </text>

  <!-- Month labels -->
  <text x="95" y="86" class="month">Jan</text>
  <text x="185" y="86" class="month">Feb</text>
  <text x="275" y="86" class="month">Mar</text>
  <text x="365" y="86" class="month">Apr</text>
  <text x="455" y="86" class="month">May</text>
  <text x="545" y="86" class="month">Jun</text>

  <!-- Day labels -->
  <text x="34" y="119" class="day">Mon</text>
  <text x="34" y="155" class="day">Wed</text>
  <text x="34" y="191" class="day">Fri</text>

  <!-- Contribution grid background -->
  <rect
    x="86"
    y="96"
    width="468"
    height="126"
    fill="url(#gridPattern)"
  />

  <!-- Light green activity cells -->
  <g>
    <!-- row 0 -->
    <use href="#cell" x="104" y="96" class="g4"/>
    <use href="#cell" x="158" y="96" class="g3"/>
    <use href="#cell" x="212" y="96" class="g2"/>
    <use href="#cell" x="284" y="96" class="g3"/>
    <use href="#cell" x="338" y="96" class="g1"/>
    <use href="#cell" x="410" y="96" class="g2"/>
    <use href="#cell" x="482" y="96" class="g3"/>

    <!-- row 1 -->
    <use href="#cell" x="86" y="114" class="g1"/>
    <use href="#cell" x="122" y="114" class="g2"/>
    <use href="#cell" x="194" y="114" class="g4"/>
    <use href="#cell" x="248" y="114" class="g2"/>
    <use href="#cell" x="320" y="114" class="g3"/>
    <use href="#cell" x="356" y="114" class="g1"/>
    <use href="#cell" x="446" y="114" class="g2"/>
    <use href="#cell" x="500" y="114" class="g4"/>

    <!-- row 2 -->
    <use href="#cell" x="104" y="132" class="g2"/>
    <use href="#cell" x="140" y="132" class="g1"/>
    <use href="#cell" x="176" y="132" class="g2"/>
    <use href="#cell" x="230" y="132" class="g4"/>
    <use href="#cell" x="284" y="132" class="g2"/>
    <use href="#cell" x="338" y="132" class="g3"/>
    <use href="#cell" x="374" y="132" class="g1"/>
    <use href="#cell" x="428" y="132" class="g2"/>
    <use href="#cell" x="464" y="132" class="g3"/>
    <use href="#cell" x="518" y="132" class="g1"/>

    <!-- row 3 -->
    <use href="#cell" x="86" y="150" class="g4"/>
    <use href="#cell" x="140" y="150" class="g3"/>
    <use href="#cell" x="194" y="150" class="g1"/>
    <use href="#cell" x="248" y="150" class="g2"/>
    <use href="#cell" x="302" y="150" class="g4"/>
    <use href="#cell" x="356" y="150" class="g2"/>
    <use href="#cell" x="410" y="150" class="g1"/>
    <use href="#cell" x="446" y="150" class="g3"/>
    <use href="#cell" x="500" y="150" class="g2"/>

    <!-- row 4 -->
    <use href="#cell" x="122" y="168" class="g2"/>
    <use href="#cell" x="176" y="168" class="g4"/>
    <use href="#cell" x="230" y="168" class="g2"/>
    <use href="#cell" x="266" y="168" class="g1"/>
    <use href="#cell" x="320" y="168" class="g3"/>
    <use href="#cell" x="374" y="168" class="g2"/>
    <use href="#cell" x="428" y="168" class="g1"/>
    <use href="#cell" x="482" y="168" class="g2"/>

    <!-- row 5 -->
    <use href="#cell" x="86" y="186" class="g1"/>
    <use href="#cell" x="158" y="186" class="g3"/>
    <use href="#cell" x="212" y="186" class="g2"/>
    <use href="#cell" x="284" y="186" class="g4"/>
    <use href="#cell" x="338" y="186" class="g1"/>
    <use href="#cell" x="392" y="186" class="g3"/>
    <use href="#cell" x="446" y="186" class="g2"/>
    <use href="#cell" x="518" y="186" class="g4"/>

    <!-- row 6 -->
    <use href="#cell" x="104" y="204" class="g4"/>
    <use href="#cell" x="140" y="204" class="g2"/>
    <use href="#cell" x="194" y="204" class="g1"/>
    <use href="#cell" x="248" y="204" class="g2"/>
    <use href="#cell" x="302" y="204" class="g4"/>
    <use href="#cell" x="356" y="204" class="g2"/>
    <use href="#cell" x="410" y="204" class="g3"/>
    <use href="#cell" x="482" y="204" class="g1"/>
  </g>

  <!-- Right-side text -->
  <text x="620" y="122" class="title" style="font-size: 16px;">Currently building.</text>
  <text x="620" y="149" class="subtext">Software · data · systems · AI</text>
  <text x="620" y="177" class="subtext">Small experiments become useful things.</text>
  <text x="620" y="205" class="subtext">Keep shipping →</text>

  <!-- Pac-Man path (through active cells) -->
  <path
    id="pacPath"
    d="
      M 92.5 120.5
      L 110.5 138.5
      L 146.5 138.5
      L 182.5 138.5
      L 236.5 156.5
      L 290.5 156.5
      L 344.5 156.5
      L 380.5 138.5
      L 434.5 138.5
      L 470.5 156.5
      L 488.5 174.5
    "
    fill="none"
    stroke="none"
  />

  <!-- pellets along the path -->
  <circle r="3.4" class="pellet">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0.18;0.18" keyTimes="0;1">
      <mpath href="#pacPath"/>
    </animateMotion>
  </circle>

  <circle r="3.4" class="pellet">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0.48;0.48" keyTimes="0;1">
      <mpath href="#pacPath"/>
    </animateMotion>
  </circle>

  <circle r="3.4" class="pellet">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0.78;0.78" keyTimes="0;1">
      <mpath href="#pacPath"/>
    </animateMotion>
  </circle>

  <!-- Pac-Man -->
  <g filter="url(#glow)">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#pacPath"/>
      </animateMotion>

      <path class="pac-body">
        <animate
          attributeName="d"
          dur="0.35s"
          repeatCount="indefinite"
          values="
            M 0 0 L 12 -8 A 13 13 0 1 1 12 8 Z;
            M 0 0 L 13 -3 A 13 13 0 1 1 13 3 Z;
            M 0 0 L 12 -8 A 13 13 0 1 1 12 8 Z
          "
        />
      </path>

      <circle cx="2.6" cy="-6" r="1.7" class="pac-eye" />
    </g>
  </g>
</svg>
